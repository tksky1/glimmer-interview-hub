server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    # 新前端（Vite base: /interview/）
    location /interview/ {
        alias /usr/share/nginx/html/interview/;
        try_files $uri $uri/ /interview/index.html;
    }

    # 入口 HTML 不缓存：发版后必须拿到新的 hash 资源，否则会继续用旧的 JS/CSS
    location = /interview/index.html {
        alias /usr/share/nginx/html/interview/index.html;
        add_header Cache-Control "no-store, must-revalidate";
    }

    # 带 hash 的静态资源可长期缓存
    location /interview/assets/ {
        alias /usr/share/nginx/html/interview/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 浏览器默认会请求站点根的 /favicon.ico
    location = /favicon.ico {
        alias /usr/share/nginx/html/interview/favicon.ico;
        add_header Cache-Control "public, max-age=86400";
    }

    # 旧前端预构建产物（仅本地预览时提供同源登录闭环，生产环境可去掉）
    location /submit/ {
        alias /usr/share/nginx/html/submit/;
        try_files $uri $uri/ /submit/index.html;
    }

    # API 反向代理到 Go 后端
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 根路径跳转到新前端
    location = / {
        return 301 /interview/;
    }

    # 其他路径回退到新前端（history 模式 SPA）
    location / {
        try_files $uri $uri/ /interview/index.html;
    }
}
